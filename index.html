
  <!DOCTYPE html>
  <html lang="ko">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>응원가 아카이브</title>
      <meta name="description" content="응원석에서 부르는 대학·야구 응원가와 그 원곡, 응원가가 된 이야기를 모은 아카이브" />
      <meta name="theme-color" content="#0c0b0a" />
      <meta name="robots" content="index, follow" />
      <!-- share-meta -->
      <link rel="canonical" href="https://cheers.app.hurdoo.kr/" />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="응원가 아카이브" />
      <meta property="og:locale" content="ko_KR" />
      <meta property="og:title" content="응원가 아카이브" />
      <meta property="og:description" content="응원석에서 부르는 대학·야구 응원가와 그 원곡, 응원가가 된 이야기를 모은 아카이브" />
      <meta property="og:url" content="https://cheers.app.hurdoo.kr/" />
      <meta property="og:image" content="https://cheers.app.hurdoo.kr/og/archive.jpg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta name="twitter:card" content="summary_large_image" />
      <!-- /share-meta -->
      <style>html, body { height: 100%; margin: 0; background: #0c0b0a; } html[data-theme="light"], html[data-theme="light"] body { background: #f6f4f0; } #root { height: 100%; }</style>
      <script>
        (function () {
          var theme;
          try { theme = localStorage.getItem("cheers-theme"); } catch (error) {}
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = theme;
          if (theme === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f6f4f0");
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
