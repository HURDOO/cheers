h3,
h4,

b,

}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;cheers-visitor-roadmap&quot;&gt;
  &lt;div class=&quot;nav nav-pills&quot; role=&quot;tablist&quot; aria-label=&quot;방문 목적&quot;&gt;
    &lt;button class=&quot;nav-link active&quot; id=&quot;cv-tab-prepare&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;cv-route-prepare&quot;&gt;① 합응 예습&lt;/button&gt;
    &lt;button class=&quot;nav-link&quot; id=&quot;cv-tab-story&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;cv-route-story&quot;&gt;② 계보가 궁금해서&lt;/button&gt;

  &lt;/div&gt;
  &lt;div id=&quot;cv-route-prepare&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;cv-tab-prepare&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;cv-route-story&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;cv-tab-story&quot; hidden&gt;&lt;/div&gt;
  &lt;div id=&quot;cv-route-return&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;cv-tab-return&quot; hidden&gt;&lt;/div&gt;
  &lt;div class=&quot;cv-path&quot; id=&quot;cv-path&quot; aria-label=&quot;방문 순서&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;cv-layout&quot;&gt;
    &lt;section class=&quot;cv-prototype&quot; aria-label=&quot;응원가 아카이브 동선 시안&quot;&gt;
      &lt;div class=&quot;cv-preview-label&quot;&gt;화면 구성 제안 · 영상 재생은 모의 동작&lt;/div&gt;
      &lt;div id=&quot;cv-screen&quot; class=&quot;cv-screen&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;aside class=&quot;cv-notes&quot; aria-label=&quot;선택한 화면의 목적&quot;&gt;
      &lt;div class=&quot;text-small text-muted&quot; id=&quot;cv-step-count&quot;&gt;&lt;/div&gt;
      &lt;h3 id=&quot;cv-stage-title&quot;&gt;&lt;/h3&gt;
      &lt;dl&gt;
        &lt;dt&gt;방문자의 생각&lt;/dt&gt;&lt;dd id=&quot;cv-thought&quot;&gt;&lt;/dd&gt;
        &lt;dt&gt;흥미가 생기는 정확한 지점&lt;/dt&gt;&lt;dd id=&quot;cv-hook&quot;&gt;&lt;/dd&gt;
        &lt;dt&gt;다음에 누를 버튼&lt;/dt&gt;&lt;dd id=&quot;cv-next&quot;&gt;&lt;/dd&gt;
        &lt;dt&gt;구현할 연결&lt;/dt&gt;&lt;dd id=&quot;cv-connection&quot;&gt;&lt;/dd&gt;
        &lt;dt&gt;확인할 행동&lt;/dt&gt;&lt;dd id=&quot;cv-measure&quot;&gt;&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;div class=&quot;cv-release text-small&quot; id=&quot;cv-release&quot;&gt;&lt;/div&gt;
    &lt;/aside&gt;
  &lt;/div&gt;
  &lt;div id=&quot;cv-announcement&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;hr&gt;
  &lt;div class=&quot;cv-deadlines&quot; aria-label=&quot;방문 동선별 실행 일정&quot;&gt;
    &lt;div class=&quot;cv-deadline&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;9/12–14&lt;/span&gt;&lt;strong&gt;연결 완성&lt;/strong&gt;&lt;span&gt;곡 재생 → 다른 버전 → 관련곡&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cv-deadline&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;9/15&lt;/span&gt;&lt;strong&gt;두 입구로 공개&lt;/strong&gt;&lt;span&gt;예습 글 → 필수곡&lt;br&gt;계보 글 → 비교 화면&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cv-deadline&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;9/16–22&lt;/span&gt;&lt;strong&gt;멈추는 곳 수정&lt;/strong&gt;&lt;span&gt;첫 재생 · 비교 · 다음 곡&lt;br&gt;각 단계의 이동 확인&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;cv-deadline&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;9/23–10/3&lt;/span&gt;&lt;strong&gt;다시 올 계기&lt;/strong&gt;&lt;span&gt;합응 회상 게시물&lt;br&gt;정기전 직전 예습 게시물&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;details class=&quot;cv-spec&quot;&gt;
    &lt;summary&gt;9월 15일 공개 범위와 통과 기준&lt;/summary&gt;
    &lt;div class=&quot;cv-spec-items&quot;&gt;
      &lt;div&gt;&lt;strong&gt;① 목적에 맞는 첫 화면&lt;/strong&gt;&lt;span&gt;예습 링크는 학교가 선택된 필수곡 영역, 계보 링크는 해당 두 곡 비교 영역에서 열린다.&lt;/span&gt;&lt;small&gt;게시물에서 클릭한 뒤 메뉴 탐색 없이 약속한 내용을 볼 수 있음&lt;/small&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;② 첫 곡 바로 듣기&lt;/strong&gt;&lt;span&gt;선택된 곡의 대표 영상과 재생 버튼을 먼저 배치한다. 행사 일정은 짧게, 긴 이야기는 접어 둔다.&lt;/span&gt;&lt;small&gt;홍보 링크를 연 뒤 한 번의 탭으로 재생을 요청할 수 있음&lt;/small&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;③ 플레이어 바로 아래 비교 카드&lt;/strong&gt;&lt;span&gt;“이 노래, LG에서도 부른다고?” → 다른 버전의 대응 구간. 원곡 공유와 직접 차용을 구분한다.&lt;/span&gt;&lt;small&gt;두 버전을 바꿔 들을 수 있고, 이전 영상은 멈춤&lt;/small&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;④ 다음 곡까지 이어지는 링크&lt;/strong&gt;&lt;span&gt;관련곡을 클릭하면 상세 내용과 주소가 함께 바뀐다. 뒤로가기로 직전 곡에 돌아온다.&lt;/span&gt;&lt;small&gt;복사한 링크를 새 창에서 열어도 같은 곡·계보가 표시됨&lt;/small&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;⑤ 공유 · 다음 소식 연결&lt;/strong&gt;&lt;span&gt;비교 아래에는 친구에게 공유, 한 이야기를 다 본 뒤에는 사이트 SNS와 다음 편 예고를 둔다.&lt;/span&gt;&lt;small&gt;공유 링크와 SNS 목적지가 맞고, 이동 버튼 클릭을 구분해 기록함&lt;/small&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;검증&lt;/strong&gt;&lt;span&gt;양교 관점, 곡이 적은 상태, 휴대폰과 SNS 앱 내 브라우저에서 ①→⑤를 확인한다.&lt;/span&gt;&lt;small&gt;사용자: 대표 영상·대응 구간·문구 확정 / Codex: 연결·구현·검사&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/details&gt;
  &lt;details class=&quot;cv-spec&quot;&gt;
    &lt;summary&gt;유입 후 어디서 멈추느냐에 따른 다음 작업&lt;/summary&gt;
    &lt;div class=&quot;cv-spec-items&quot;&gt;
      &lt;div&gt;&lt;strong&gt;방문 → 첫 재생에서 멈춤&lt;/strong&gt;&lt;span&gt;게시물과 첫 화면의 곡이 맞는지, 재생 버튼이 바로 보이는지 먼저 수정한다.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;첫 재생 → 비교에서 멈춤&lt;/strong&gt;&lt;span&gt;비교 카드를 플레이어 가까이 옮기고, 두 곡의 닮은 구간과 문구를 다듬는다.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;비교는 하지만 다음 곡으로 안 감&lt;/strong&gt;&lt;span&gt;“전체 아카이브” 링크보다 해당 학교·구단의 구체적인 다음 계보 한 편을 제안한다.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;읽고 듣지만 재방문이 적음&lt;/strong&gt;&lt;span&gt;같은 SNS에서 합응 회상·정기전 예습 게시물을 내고, 기존 방문자의 행사 기간 재유입을 확인한다.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/details&gt;

      return page(`${title(&#x27;공유할 비교 링크&#x27;,&#x27;연세 × LG,&lt;br&gt;친구에게도 알려주기.&#x27;)}&lt;div class=&quot;cp-focus&quot;&gt;&lt;strong&gt;연세여 사랑한다 ↔ 사랑한다 LG&lt;/strong&gt;&lt;span class=&quot;cp-caption&quot;&gt;열면 두 버전 비교가 바로 보이는 링크&lt;/span&gt;${state.shared?&#x27;&lt;div class=&quot;cp-message&quot; style=&quot;margin-top:10px&quot;&gt;공유 링크 구성 예시 확인됨&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;cp-focus&quot;&gt;&lt;strong&gt;정기전 전에 다시 듣자&lt;/strong&gt;&lt;p class=&quot;cp-body&quot;&gt;10/2–3 정기전 전에 예습 목록을 다시 안내해요.&lt;/p&gt;${button(state.followed?&#x27;사이트 SNS 프로필로 연결&#x27;:&#x27;정기전 예습 소식 보기 →&#x27;,&#x27;follow&#x27;)}&lt;/div&gt;`,&#x27;비교 완료 뒤 → 공유 / 사이트 SNS&#x27;);

  function render(){
    const route=routes[state.route], detail=route.steps[state.step];

    const targets=[&#x27;cv-stage-title&#x27;,&#x27;cv-thought&#x27;,&#x27;cv-hook&#x27;,&#x27;cv-next&#x27;,&#x27;cv-connection&#x27;,&#x27;cv-measure&#x27;,&#x27;cv-release&#x27;];

    root.querySelector(&#x27;#cv-announcement&#x27;).textContent=detail[0];
  }
  function selectRoute(route){
    state.route=route; state.step=1; state.version=&#x27;yonsei&#x27;; state.played=false; state.shared=false; state.followed=false;
    root.querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;).forEach(tab=&gt;{const active=tab.id===&#x27;cv-tab-&#x27;+route; tab.setAttribute(&#x27;aria-selected&#x27;,String(active));tab.classList.toggle(&#x27;active&#x27;,active);root.querySelector(&#x27;#&#x27;+tab.getAttribute(&#x27;aria-controls&#x27;)).hidden=!active;});
    render();
  }
  root.addEventListener(&#x27;click&#x27;,event=&gt;{
    const tab=event.target.closest(&#x27;[role=&quot;tab&quot;]&#x27;);
    if(tab){selectRoute(tab.id.replace(&#x27;cv-tab-&#x27;,&#x27;&#x27;)); return;}
    const step=event.target.closest(&#x27;[data-step]&#x27;);
    if(step){state.step=Number(step.dataset.step);state.played=false;render();return;}
    const version=event.target.closest(&#x27;[data-version]&#x27;);
    if(version){state.version=version.dataset.version;state.played=false;render();return;}
    const action=event.target.closest(&#x27;[data-action]&#x27;)?.dataset.action;
    if(!action)return;
    if(action===&#x27;follow&#x27;){state.followed=true;render();return;}
    if(action===&#x27;share&#x27;){state.shared=true;render();return;}
    if(action===&#x27;return&#x27;){selectRoute(&#x27;prepare&#x27;);return;}
    if(action===&#x27;play&#x27;){
      state.played=true;
      if(state.route===&#x27;story&#x27;&amp;&amp;state.step===1)state.step=2;
      render();return;
    }
    if(action===&#x27;share-next&#x27;)state.shared=true;
    state.step=Math.min(state.step+1,4);state.played=state.route===&#x27;story&#x27;&amp;&amp;state.step===2;render();
  });
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root.querySelector(&#x27;.cv-prototype&#x27;),onChange:render});
    tweak.addSelect(design,&#x27;bridge&#x27;,{label:&#x27;계보 카드 위치&#x27;,options:[{label:&#x27;첫 재생 바로 아래 · 추천&#x27;,value:&#x27;after-player&#x27;},{label:&#x27;첫 재생 위&#x27;,value:&#x27;before-player&#x27;}]});
  }
})();
