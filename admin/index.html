<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f2f4f6" />
    <title>Cheers Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="주 메뉴">
        <a class="brand" href="#overview" aria-label="Cheers Console 홈">
          <span class="brand-symbol" aria-hidden="true">C</span>
          <span class="brand-copy"><strong>Cheers</strong><small>Content Console</small></span>
        </a>

        <nav class="main-nav">
          <button type="button" class="nav-item is-active" data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" /></svg>
            <span>대시보드</span>
          </button>
          <button type="button" class="nav-item" data-view="organizations">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V8l8-5 8 5v13h-6v-6h-4v6H4Zm3-3h1v-5h8v5h1V9.7l-5-3.1-5 3.1V18Z" /></svg>
            <span>대학·구단</span>
            <span id="nav-organization-count" class="nav-count">0</span>
          </button>
          <button type="button" class="nav-item" data-view="songs">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 18.5A3.5 3.5 0 1 1 8 15.34V5l11-2v12.5a3.5 3.5 0 1 1-2-3.16V7.42l-7 1.27v9.81Z" /></svg>
            <span>응원가</span>
            <span id="nav-song-count" class="nav-count">0</span>
          </button>
          <button type="button" class="nav-item" data-view="reels">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v3h3V5H5Zm5 0v3h4V5h-4Zm6 0v3h3V5h-3ZM5 10v9h14v-9H5Zm5 2.2 5 2.8-5 2.8v-5.6Z" /></svg>
            <span>릴스 제작</span>
            <span id="nav-reel-count" class="nav-count">0</span>
          </button>
        </nav>

        <div class="sidebar-meta">
          <span class="status-dot" aria-hidden="true"></span>
          <div><strong>Local database</strong><small>사설망 연결됨</small></div>
        </div>
      </aside>

      <section class="main-shell">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-symbol">C</span><strong>Cheers</strong></div>
          <div class="breadcrumb"><span>Content</span><span>/</span><strong id="page-breadcrumb">대시보드</strong></div>
          <div class="topbar-actions">
            <span id="sync-state" class="sync-state"><span></span>불러오는 중</span>
            <button id="refresh-button" type="button" class="icon-button" aria-label="데이터 새로고침" title="새로고침">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.1 4.9A9 9 0 1 0 21 14h-2.1a7 7 0 1 1-1.3-7.6L14 10h7V3l-1.9 1.9Z" /></svg>
            </button>
          </div>
        </header>

        <main id="view-root" class="view-root" tabindex="-1">
          <div class="initial-loading" aria-live="polite">
            <span class="loading-spinner"></span>
            <p>콘텐츠 데이터베이스를 불러오고 있어요</p>
          </div>
        </main>
      </section>
    </div>

    <div id="drawer-layer" class="drawer-layer" hidden>
      <button id="drawer-backdrop" class="drawer-backdrop" type="button" aria-label="편집 패널 닫기"></button>
      <aside id="entity-drawer" class="entity-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="drawer-header">
          <div>
            <span id="drawer-eyebrow" class="drawer-eyebrow">DATABASE ROW</span>
            <h2 id="drawer-title">데이터 편집</h2>
            <p id="drawer-subtitle"></p>
          </div>
          <div class="drawer-header-actions">
            <button id="drawer-expand" type="button" class="icon-button" aria-label="편집 화면 크게 보기" title="크게 보기" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10V4h6v2H6v4H4Zm10-6h6v6h-2V6h-4V4ZM4 14h2v4h4v2H4v-6Zm14 0h2v6h-6v-2h4v-4Z" /></svg>
            </button>
            <button id="drawer-close" type="button" class="icon-button" aria-label="편집 패널 닫기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z" /></svg>
            </button>
          </div>
        </header>
        <form id="entity-form" class="entity-form">
          <div id="drawer-body" class="drawer-body"></div>
          <footer class="drawer-footer">
            <button id="delete-entity-button" type="button" class="button button-danger-ghost" hidden>삭제</button>
            <div class="drawer-footer-main">
              <button id="cancel-entity-button" type="button" class="button button-secondary">취소</button>
              <button id="save-entity-button" type="submit" class="button button-primary">저장</button>
            </div>
          </footer>
        </form>
      </aside>
    </div>

    <dialog id="confirm-dialog" class="modal">
      <form method="dialog" class="modal-card">
        <div id="confirm-icon" class="modal-icon" aria-hidden="true">!</div>
        <h2 id="confirm-title">삭제할까요?</h2>
        <p id="confirm-message"></p>
        <label id="confirm-phrase-wrap" class="field" hidden>
          <span id="confirm-phrase-label">확인 문구</span>
          <input id="confirm-phrase-input" autocomplete="off" />
        </label>
        <div class="modal-actions">
          <button value="cancel" class="button button-secondary">취소</button>
          <button id="confirm-action" value="confirm" class="button button-danger">삭제</button>
        </div>
      </form>
    </dialog>

    <dialog id="import-dialog" class="modal modal-wide">
      <form id="import-form" class="modal-card">
        <header class="modal-header-row">
          <div><span class="drawer-eyebrow">BULK INSERT</span><h2>응원가 목록 추가</h2></div>
          <button type="button" class="icon-button" data-close-import aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z" /></svg>
          </button>
        </header>
        <p class="modal-description">번호나 불릿이 있어도 한 줄에 한 곡씩 자동으로 정리해요.</p>
        <label class="field"><span>대학·구단</span><select id="import-organization" required></select></label>
        <div class="import-grid">
          <label class="field"><span>조사 대상</span><textarea name="targetText" rows="7" placeholder="1. 첫 번째 응원가&#10;2. 두 번째 응원가"></textarea></label>
          <label class="field"><span>나중에 조사</span><textarea name="deferredText" rows="7"></textarea></label>
          <label class="field"><span>AI 추가 발견</span><textarea name="discoveredText" rows="7"></textarea></label>
        </div>
        <div class="modal-actions">
          <button type="button" class="button button-secondary" data-close-import>취소</button>
          <button type="submit" class="button button-primary">목록 추가</button>
        </div>
      </form>
    </dialog>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
