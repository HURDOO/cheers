<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>응원가 검수실</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login-view" class="login-shell">
      <main class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">승</div>
        <p class="eyebrow">LOCAL REVIEW ROOM</p>
        <h1 id="login-title">응원가 검수실</h1>
        <p class="login-copy">조사 근거를 확인하고 승인한 내용을 로컬 사이트 데이터에 반영합니다.</p>
        <form id="login-form">
          <label for="pin">검수 비밀번호</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" autofocus />
          <p id="login-error" class="form-error" role="alert"></p>
          <button type="submit" class="button button-primary button-wide">검수실 입장</button>
        </form>
        <p class="local-note"><span aria-hidden="true">●</span> 이 도구는 현재 컴퓨터에서만 열립니다.</p>
      </main>
    </div>

    <div id="app-view" class="app-shell" hidden>
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark brand-mark-small" aria-hidden="true">승</div>
          <div>
            <p class="eyebrow">LOCAL REVIEW ROOM</p>
            <h1>응원가 검수실</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="save-indicator" class="save-indicator">모든 변경 저장됨</span>
          <button id="refresh-button" class="button button-quiet" type="button">새로고침</button>
          <button id="check-button" class="button button-secondary" type="button">전체 검사</button>
          <button id="logout-button" class="button button-quiet" type="button">나가기</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <section class="sidebar-head">
            <label for="batch-select">조사 배치</label>
            <select id="batch-select"></select>
            <div id="organization-control" class="organization-control" hidden>
              <label for="organization-select">조직</label>
              <select id="organization-select"></select>
            </div>
            <div id="batch-summary" class="summary-grid"></div>
          </section>

          <div id="filter-row" class="filter-row" role="group" aria-label="후보 필터">
            <button class="filter-button active" type="button" data-filter="all">전체</button>
            <button class="filter-button" type="button" data-filter="pending">대기</button>
            <button class="filter-button" type="button" data-filter="approved">승인</button>
            <button class="filter-button" type="button" data-filter="rejected">반려</button>
          </div>
          <label class="search-box">
            <span class="sr-only">곡 검색</span>
            <input id="search-input" type="search" placeholder="곡명이나 팀 검색" />
          </label>
          <nav id="candidate-list" class="candidate-list" aria-label="검수 후보"></nav>

          <div id="sidebar-footer" class="sidebar-footer">
            <button id="publish-batch-button" class="button button-primary button-wide" type="button">승인 항목 일괄 반영</button>
            <p id="sidebar-footer-copy">승인된 초안만 <code>data/cheer-songs.json</code>에 반영합니다.</p>
          </div>
        </aside>

        <main id="review-pane" class="review-pane">
          <div class="empty-state">
            <div class="empty-icon" aria-hidden="true">♪</div>
            <h2>검수할 곡을 선택하세요</h2>
            <p>왼쪽 목록에서 조사 후보를 선택하면 근거와 정본 초안을 함께 볼 수 있습니다.</p>
          </div>
        </main>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog id="output-dialog" class="output-dialog">
      <form method="dialog" class="dialog-card">
        <header>
          <div>
            <p class="eyebrow">VALIDATION OUTPUT</p>
            <h2 id="output-title">검사 결과</h2>
          </div>
          <button class="icon-button" value="close" aria-label="닫기">×</button>
        </header>
        <pre id="output-content"></pre>
        <footer>
          <button class="button button-secondary" value="close">닫기</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
