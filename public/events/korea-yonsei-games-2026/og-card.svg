<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">2026 연고전·고연전 응원가 예습</title>
  <desc id="description">연세대학교와 고려대학교의 합동응원전 및 정기전 응원가 가이드</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a30"/>
      <stop offset="0.48" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#250711"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#0872d9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0872d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="1" cy="0.5" r="0.78">
      <stop offset="0" stop-color="#c41449" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#c41449" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c91ec"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e43e70"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>
  <path d="M0 517C194 459 329 470 491 518C655 568 798 585 1200 485V630H0Z" fill="#ffffff" opacity="0.035"/>
  <path d="M0 550C211 493 360 507 531 553C713 602 864 602 1200 518" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="72" y="86" fill="#dbe8f6" font-size="21" font-weight="700" letter-spacing="4">2026 MATCHDAY GUIDE</text>
    <rect x="72" y="110" width="480" height="4" rx="2" fill="url(#rule)"/>

    <text x="68" y="237" fill="#ffffff" font-size="80" font-weight="850" letter-spacing="-5">연고전 · 고연전</text>
    <text x="72" y="302" fill="#ffffff" fill-opacity="0.82" font-size="30" font-weight="560" letter-spacing="-1.4">합동응원전 가기 전, 다시 듣는 우리의 응원가</text>

    <g transform="translate(72 358)">
