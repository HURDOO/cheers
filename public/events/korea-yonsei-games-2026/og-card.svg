    <g transform="translate(822 147)" filter="url(#shadow)">
      <circle cx="114" cy="114" r="112" fill="#0757a7" stroke="#75beff" stroke-opacity="0.65" stroke-width="3"/>
      <circle cx="114" cy="114" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
      <text x="114" y="151" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="112" font-weight="700">Y</text>
